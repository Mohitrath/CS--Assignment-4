<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Login</title>
<style>
 body{font-family:Arial,sans-serif;max-width:380px;margin:60px auto}
 input{display:block;width:100%;padding:8px;margin:8px 0;box-sizing:border-box}
 button{padding:8px 16px}
 .mode{padding:6px;background:#eee;font-size:12px}
 .err{color:#b00}
</style></head>
<body>
 <div class="mode">Mode: {{ 'PROTECTED' if protected else 'VULNERABLE' }}</div>
 <h2>Login</h2>
 {% if error %}<p class="err">{{ error }}</p>{% endif %}
 <form method="POST" action="/login">
   <input name="username" placeholder="Username" required>
   <input name="password" type="password" placeholder="Password" required>
   <button type="submit">Login</button>
 </form>
</body>
</html>
