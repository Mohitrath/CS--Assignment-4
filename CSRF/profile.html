<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Profile</title>
<style>
 body{font-family:Arial,sans-serif;max-width:480px;margin:60px auto}
 input{padding:8px;width:70%}
 button{padding:8px 16px}
 .mode{padding:6px;background:#eee;font-size:12px}
 .msg{color:#070}
</style></head>
<body>
 <div class="mode">Mode: {{ 'PROTECTED' if protected else 'VULNERABLE' }}</div>
 <h2>Welcome, {{ username }}</h2>
 {% if message %}<p class="msg">{{ message }}</p>{% endif %}
 <p><b>Current email:</b> <span id="email">{{ email }}</span></p>

 <h3>Change email</h3>
 {% if protected %}
 <form method="POST" action="/change-email">
   <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
   <input name="email" type="email" placeholder="New email" required>
   <button type="submit">Update</button>
 </form>
 {% else %}
 <form method="GET" action="/change-email">
   <input name="email" type="email" placeholder="New email" required>
   <button type="submit">Update</button>
 </form>
 {% endif %}

 <p><a href="/logout">Logout</a></p>
</body>
</html>
